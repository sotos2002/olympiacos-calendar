name: Add TV info to Olympiacos calendar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate, normalize and add confirmed fixtures
        shell: python
        run: |
          from pathlib import Path

          p = Path('Olympiakos.ics')
          text = p.read_text(encoding='utf-8')

          # Remove stray backslashes that were accidentally written at line ends.
          text = text.replace('\\\n', '\n')
          text = text.replace('\r\n', '\n').replace('\r', '\n')

          lines = text.splitlines()
          out = []
          current_summary = ''

          nova_home = ('Αστέρας', 'Λεβαδειακός', 'ΠΑΟΚ', 'Άρης', 'Ατρόμητος', 'Καλαμάτα')
          cos_home = ('Ολυμπιακός', 'ΑΕΚ', 'ΟΦΗ', 'Βόλος', 'Κηφισιά', 'Παναιτωλικός')

          for line in lines:
              if line.startswith('SUMMARY:'):
                  current_summary = line[8:]

              if line.startswith('DESCRIPTION:') and 'TV:' not in line and current_summary:
                  if current_summary.startswith('🏀'):
                      tv = '📺 TV: Novasports'
                  elif current_summary.startswith('⚽'):
                      matchup = current_summary[2:].strip()
                      home = matchup.split(' - ', 1)[0].strip()
                      if any(home.startswith(x) for x in nova_home):
                          tv = '📺 TV: Novasports'
                      elif any(home.startswith(x) for x in cos_home):
                          tv = '📺 TV: COSMOTE SPORT'
                      else:
                          tv = ''
                  else:
                      tv = ''

                  if tv:
                      line = line + '\\n' + tv

              out.append(line.rstrip('\\'))

          text = '\n'.join(out).rstrip() + '\n'

          # Confirmed fixture found today on the official Olympiacos BC schedule:
          # Crete International Basketball Tournament semi-final, 04/09/2026 21:00.
          # Keep a stable UID so later edits update the same event.
          uid = 'oly-20260904-crete-ibt-sf@sotiris'
          if f'UID:{uid}' not in text:
              event = (
                  'BEGIN:VEVENT\n'
                  f'UID:{uid}\n'
                  'DTSTAMP:20260903T060000Z\n'
                  'DTSTART;TZID=Europe/Athens:20260904T210000\n'
                  'DTEND;TZID=Europe/Athens:20260904T230000\n'
                  'SUMMARY:🏀 Ολυμπιακός - Φενέρμπαχτσε\n'
                  'LOCATION:Δύο Αοράκια, Ηράκλειο\n'
                  'DESCRIPTION:Crete International Basketball Tournament - Semi Final\\n📺 TV: COSMOTE SPORT 4 HD\n'
                  'END:VEVENT\n'
              )
              text = text.replace('END:VCALENDAR\n', event + 'END:VCALENDAR\n')

          p.write_text(text, encoding='utf-8')

      - name: Commit normalized calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Olympiakos.ics
          git diff --cached --quiet || git commit -m 'Update confirmed Olympiacos fixture'
          git push
