name: Add TV info and results to Olympiacos calendar

on:
  schedule:
    - cron: '5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize, add confirmed fixtures, scores and highlights
        shell: python
        run: |
          from pathlib import Path

          p = Path('Olympiakos.ics')
          text = p.read_text(encoding='utf-8')
          text = text.replace('\\\n', '\n').replace('\r\n', '\n').replace('\r', '\n')

          # Confirmed final results and Gazzetta highlights. Keep UIDs stable.
          results = {
              'oly-20260830-football@sotiris': ('0-1', 'Αστέρας Τρίπολης 0-1 Ολυμπιακός', 'https://www.gazzetta.gr/football/superleague/2565210/asteras-olympiakos-0-1-ta-highlights-tis-erythroleykis-nikis'),
              'oly-20260902-cup-ael@sotiris': ('0-4', 'ΑΕΛ 0-4 Ολυμπιακός', 'https://www.gazzetta.gr/football/kypello-elladas/2566001/ael-olympiakos-ta-highlights-toy-0-4-ton-erythroleykon'),
              'oly-20260904-crete-ibt-sf@sotiris': ('82-77', 'Ολυμπιακός 82-77 Φενέρμπαχτσε', 'https://www.gazzetta.gr/basketball/euroleague/2566566/olympiakos-fenermpahtse-82-77-ta-highlights-tis-erythroleykis-nikis'),
          }

          lines = text.splitlines()
          out = []
          current_uid = ''
          for line in lines:
              if line.startswith('UID:'):
                  current_uid = line[4:]

              if line.startswith('SUMMARY:') and current_uid in results:
                  score, _, _ = results[current_uid]
                  if '| ΤΕΛΙΚΟ ' not in line:
                      line += ' | ΤΕΛΙΚΟ ' + score

              if line.startswith('DESCRIPTION:') and current_uid in results:
                  _, score_text, highlight = results[current_uid]
                  if '🎬 Highlights:' not in line:
                      line += '\\n\\nΤΕΛΙΚΟ ΣΚΟΡ: ' + score_text + '\\n\\n🎬 Highlights: ' + highlight

              out.append(line.rstrip('\\'))

          text = '\n'.join(out).rstrip() + '\n'
          p.write_text(text, encoding='utf-8')

      - name: Commit normalized calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Olympiakos.ics
          git diff --cached --quiet || git commit -m 'Update Olympiacos results and highlights'
          git push
