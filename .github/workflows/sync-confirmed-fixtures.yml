name: Sync confirmed Olympiacos fixtures

on:
  schedule:
    - cron: '5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: olympiacos-calendar-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add or update confirmed fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Olympiakos.ics')
          text = path.read_text(encoding='utf-8')
          original = text

          # Confirmed Greek Cup fixture from the official Olympiacos site.
          fixture = """BEGIN:VEVENT
          UID:oly-20260908-cup-volos@sotiris
          DTSTAMP:20260905T000000Z
          DTSTART;TZID=Europe/Athens:20260908T214500
          DTEND;TZID=Europe/Athens:20260908T234500
          SUMMARY:🏆 Ολυμπιακός - Βόλος
          LOCATION:Γ. Καραϊσκάκης
          DESCRIPTION:Κύπελλο Ελλάδας League Phase
          END:VEVENT"""
          fixture = '\n'.join(line.strip() for line in fixture.splitlines())

          if 'UID:oly-20260908-cup-volos@sotiris' not in text:
              marker = 'END:VCALENDAR'
              if marker not in text:
                  raise SystemExit('END:VCALENDAR not found in Olympiakos.ics')
              text = text.replace(marker, fixture + '\n' + marker, 1)
              print('Added confirmed fixture: Olympiacos - Volos, 2026-09-08 21:45')

          # Official Olympiacos match center confirms Europa League MD1
          # vs Jagiellonia on 16/09/2026 at 22:00.
          uid = 'UID:oly-20260916-europa@sotiris'
          if uid in text:
              old = 'DTSTART;VALUE=DATE:20260916'
              new = 'DTSTART;TZID=Europe/Athens:20260916T220000\nDTEND;TZID=Europe/Athens:20260917T000000'
              if old in text:
                  text = text.replace(old, new, 1)
              text = text.replace('UEFA Europa League MD1 | 📺 COSMOTE SPORT | Ώρα: TBC', 'UEFA Europa League MD1 | 📺 COSMOTE SPORT | Ώρα: 22:00', 1)
              print('Synced confirmed fixture: Olympiacos - Jagiellonia, 2026-09-16 22:00')

          # Official Olympiacos BC currently lists the EuroLeague Super Cup
          # semifinal as Olympiacos - Fenerbahce on 18/09/2026 at 17:00.
          if 'UID:oly-20260918-supercup-sf@sotiris' in text:
              old = 'SUMMARY:🏀 Φενέρμπαχτσε - Ολυμπιακός'
              new = 'SUMMARY:🏀 Ολυμπιακός - Φενέρμπαχτσε'
              if old in text:
                  text = text.replace(old, new, 1)
                  print('Synced confirmed home designation: Olympiacos - Fenerbahce, 2026-09-18 17:00')

          # The official Olympiacos schedule currently has no assigned date/time
          # for Levadiakos - Olympiacos. Remove the old dated event rather than
          # keeping an unconfirmed date in the subscribed calendar.
          lines = text.replace('\r\n', '\n').replace('\r', '\n').splitlines()
          out = []
          in_levadiakos = False
          removed = False
          for line in lines:
              if line == 'BEGIN:VEVENT':
                  in_levadiakos = False
              if line == 'UID:oly-20260919-football@sotiris':
                  in_levadiakos = True
                  removed = True
              if line == 'END:VEVENT' and in_levadiakos:
                  in_levadiakos = False
                  continue
              if not in_levadiakos:
                  out.append(line)
          if removed:
              text = '\n'.join(out).rstrip() + '\n'
              print('Removed unconfirmed dated event: Levadiakos - Olympiacos (date/time now TBC)')

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Calendar updated.')
          else:
              print('No calendar changes needed.')
          PY

      - name: Commit calendar changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Olympiakos.ics
          git diff --cached --quiet || git commit -m 'Sync confirmed Olympiacos fixtures'
          git push
